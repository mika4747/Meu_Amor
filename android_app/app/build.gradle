plugins {
    id 'com.android.application'
}

android {
    namespace 'com.meuamor.postador'
    compileSdk 36

    defaultConfig {
        applicationId 'com.meuamor.postador'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        // Chave fixa guardada no repositório para que as próximas versões do APK
        // possam ser instaladas por cima da anterior. É só para uso pessoal (não é
        // uma chave para publicar na Play Store).
        pessoal {
            storeFile file('postador.keystore')
            storePassword 'postador'
            keyAlias 'postador'
            keyPassword 'postador'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.pessoal
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.pessoal
        }
    }

    lint {
        // Evita baixar as dependências do lint a cada build de release.
        checkReleaseBuilds false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // O Robolectric precisa disso no Java 17+.
                jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED',
                        '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED',
                        '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
