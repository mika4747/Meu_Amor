name: App Android

# A cada modificação no app, compila um APK novo (versão = execução + 100)
# e publica como Release. O app instalado encontra essa Release e se atualiza.
on:
  push:
    paths:
      - 'fb_bot/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compilar APK
        working-directory: fb_bot/android
        run: |
          VERSION=$(( ${{ github.run_number }} + 100 ))
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          gradle assembleRelease -PversionCode=$VERSION
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/MeuBotReels.apk"

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty='%s%n%n%b' | grep -v -E '^(Co-Authored-By|Claude-Session):' > notas.txt
          gh release create "v$VERSION" MeuBotReels.apk \
            --title "Meu Bot Reels — versão $VERSION" \
            --notes-file notas.txt \
            --target "${{ github.sha }}" \
            --latest
